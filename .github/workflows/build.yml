name: Build iPhone app

on:
  push:
    branches: [main]
  workflow_dispatch:

# Write access lets the last step put the finished app on the "builds" branch.
permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned, Sideloadly signs it)
        run: |
          xcodebuild \
            -project ShotGuide.xcodeproj \
            -scheme ShotGuide \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build > xcodebuild.log 2>&1 || { grep -E "error:" xcodebuild.log | sort -u | head -150; exit 1; }
          grep -E "warning:" xcodebuild.log | sort -u | head -80 || true

      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/ShotGuide.app Payload/
          zip -qry ShotGuide.ipa Payload
          ls -lh ShotGuide.ipa

      - name: Describe the app
        run: |
          APP=Payload/ShotGuide.app
          {
            echo "commit: $GITHUB_SHA"
            xcodebuild -version
            echo
            ls -la "$APP"
            echo
            lipo -info "$APP/ShotGuide"
            echo
            plutil -p "$APP/Info.plist"
          } > build-info.txt 2>&1
          cat build-info.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ShotGuide-ipa
          path: ShotGuide.ipa

      # The newest app, its details and any build errors always sit on the "builds" branch,
      # so the app can be downloaded from github.com/<owner>/shot-guide/raw/builds/ShotGuide.ipa.
      - name: Publish to the builds branch
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          TOKEN: ${{ github.token }}
        run: |
          mkdir -p out
          cp ShotGuide.ipa out/ 2>/dev/null || true
          cp build-info.txt out/ 2>/dev/null || true
          if [ -f xcodebuild.log ]; then
            grep -E "error:|warning:" xcodebuild.log | sort -u > out/build-problems.txt || true
            tail -300 xcodebuild.log > out/build-log-tail.txt
          fi
          echo "$JOB_STATUS $GITHUB_SHA $(date -u +%Y-%m-%dT%H:%M:%SZ)" > out/STATUS.txt
          cd out
          git init -q -b builds
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Build of ${GITHUB_SHA::7}: $JOB_STATUS"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" builds
