name: Build iPhone app

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned, Sideloadly signs it)
        run: |
          xcodebuild \
            -project ShotGuide.xcodeproj \
            -scheme ShotGuide \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build > xcodebuild.log 2>&1 || { grep -E "error:" xcodebuild.log | sort -u | head -150; exit 1; }
          grep -E "warning:" xcodebuild.log | sort -u | head -80 || true

      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/ShotGuide.app Payload/
          zip -qry ShotGuide.ipa Payload
          ls -lh ShotGuide.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: ShotGuide-ipa
          path: ShotGuide.ipa

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: xcodebuild.log
          if-no-files-found: ignore
