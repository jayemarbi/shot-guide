function countsFor(day, clips) {
  const type = DAYS[day].type;
  const dayClips = clips.filter(c => c.day === day);
  const rows = {};
  let done = 0, total = 0;
  for (const ph of PHASES) for (const [k, h] of ph.slots) {
    const si = slotInfo(k, h, type);
    const count = h === undefined ? dayClips.filter(c => c.shot === k).length : 0;
    rows[si.id] = { si, count };
    if (si.counts) { total += si.n; done += Math.min(count, si.n); }
  }
  return { rows, done, total, dayClips };
}

const cache = {};
function setHTML(el, html, key) { if (cache[key] !== html) { el.innerHTML = html; cache[key] = html; } }

  if (spec === 'max') return max;

  const el = content.querySelector(spec.sel);

  return clamp(offsetIn(el, content) - spec.off, 0, max);
}
const mix = (a, b, p) => (p <= 0 ? a : p >= 1 ? b : { mix: true, a, b, p });
function place(el, L) {

}

    setHTML($('#d-nav'), sheetNav('Cancel', 'Start day 2', 'Start', true, '', 'd-start'), 'dnav');
    setHTML($('#d-content'), daySheetHTML(st.daysheet), 'd');
    $('#d-card').style.transform = `translateY(${((1 - st.daysheet.p) * 800).toFixed(2)}px)`;
  } else Ld.style.display = 'none';
  $('#scrdip').style.opacity = (st.dip || 0).toFixed(3);
  // highlights and taps
  for (const el of touched) { el.style.boxShadow = ''; el.style.backgroundColor = ''; }
  touched = [];
  for (const h of st.hl) {
    if (!(h.a > 0)) continue;
    const el = $(h.sel); if (!el) continue;
    el.style.boxShadow = `inset 0 0 0 2px rgba(255,159,10,${h.a.toFixed(3)})`;
    el.style.backgroundColor = `rgba(255,159,10,${(0.14 * h.a).toFixed(3)})`;
    touched.push(el);
  }
  const tapEl = $('#tap'); tapEl.style.opacity = '0';
  st.taps.forEach((tp, n) => {
    const age = st.local - tp.at;
    if (age < 0 || age >= 0.55) return;
    const el = $(tp.sel); if (!el) return;
    // The ring stays where the finger landed, even if a sheet then slides over that spot.
    const key = st.sceneIdx + ':' + n;
    if (!tapCache[key] || age < 0.034) {
      const r = el.getBoundingClientRect(), sr = $('#screen').getBoundingClientRect(), k = sr.width / 393;
      tapCache[key] = [(r.left + r.width / 2 - sr.left) / k + (tp.dx || 0), (r.top + r.height / 2 - sr.top) / k + (tp.dy || 0)];
    }
    const [x, y] = tapCache[key];
    const op = age < 0.08 ? age / 0.08 : age < 0.26 ? 1 : 1 - (age - 0.26) / 0.29;
    const sc = 0.72 + 0.38 * easeOut(clamp(age / 0.3));
    tapEl.style.transform = `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px) scale(${sc.toFixed(3)})`;
    tapEl.style.opacity = clamp(op).toFixed(3);
    if (age < 0.3 && el.classList.contains('row')) { el.style.backgroundColor = 'rgba(255,255,255,.1)'; touched.push(el); }
  });
  $('#sped').style.opacity = (st.sped || 0).toFixed(3);
  $('#enddim').style.opacity = (0.82 * (st.endP || 0)).toFixed(3);
  $('#endcard').style.opacity = (st.endP || 0).toFixed(3);
  $('#endcard').style.transform = `translateY(${((1 - (st.endP || 0)) * 30).toFixed(1)}px)`;
  $('#fade').style.opacity = (1 - (st.fade === undefined ? 1 : st.fade)).toFixed(3);
}

// ---------- captions ----------
function capHTML(c, bodyOnly) {
  if (bodyOnly) return `<div style="visibility:hidden"><span class="pill">${c.step}</span><div class="ctitle">${c.title}</div></div><div class="cbody">${c.body}</div>`;
  return `<span class="pill">${c.step}</span><div class="ctitle">${c.title}</div><div class="cbody">${c.body}</div>`;
}
function capsOf(i) {
  const out = []; let last = {};
  for (const c of SCENES[i].cap) { last = Object.assign({}, last, c); if (typeof last.step === 'number') last.stepLabel = 'STEP ' + last.step; out.push(Object.assign({}, last, { step: typeof last.step === 'number' ? 'STEP ' + last.step : last.step })); }
  return out;
}
function applyCaption(i, t) {
  const caps = capsOf(i);
  let ci = 0; caps.forEach((c, k) => { if (c.at <= t) ci = k; });
  const cur = caps[ci];
  let prev = null;
  if (ci > 0) prev = caps[ci - 1]; else if (i > 0) { const pc = capsOf(i - 1); prev = pc[pc.length - 1]; }
  const dt = t - cur.at;
  const A = $('#capA'), B = $('#capB');
  if (!prev) { A.innerHTML = capHTML(cur); A.style.opacity = clamp((t - 0.15) / 0.5).toFixed(3); B.style.opacity = '0'; return; }
  const sameStep = prev.step === cur.step && prev.title === cur.title;
  if (sameStep) {
    // title stays, body crossfades
    A.innerHTML = `<span class="pill">${cur.step}</span><div class="ctitle">${cur.title}</div><div class="cbody" style="opacity:${clamp((dt - 0.2) / 0.3).toFixed(3)}">${cur.body}</div>`;
    A.style.opacity = '1';
    B.innerHTML = capHTML(prev, true); B.style.opacity = (1 - clamp(dt / 0.2)).toFixed(3);
  } else {
    A.innerHTML = capHTML(cur); A.style.opacity = clamp((dt - 0.2) / 0.3).toFixed(3);
    B.innerHTML = capHTML(prev); B.style.opacity = (1 - clamp(dt / 0.2)).toFixed(3);
  }
}

// ---------- the walkthrough ----------
const SCENES = [];
function scene(id, dur, cap, render) { SCENES.push({ id, dur, cap, render }); }
function base(time) { return { time, trips: { warn: 0, spring: null }, newtrip: null, trip: null, camera: null, review: null, daysheet: null, taps: [], hl: [], sped: 0, endP: 0 }; }
const ATSPOT = { sel: '#t-sec-atspot', off: 92 };
const ARRIVING = { sel: '#t-sec-arriving', off: 92 };
const ATSPOT_LOW = { sel: '#t-sec-atspot', off: 40 };
function T(o) { return Object.assign({ x: 1, sel: 1, days: 1, clips: [], scroll: 0 }, o); }
function cam(o) { return Object.assign({ p: 1, kind: 'lower', shot: 'WIDE', take: 1, lens: '0.5x', phase: 'ready', elapsed: 0, before: '', stop: 14, msg: '', t: 0 }, o); }
function rev(o) { return Object.assign({ p: 1, title: '', kind: 'lower', name: '', focused: false, note: false, chips: [], chipsLabel: '', hint: '', code: 'Springbrook', date: '2026-11-14', shot: 'WIDE', take: 1, details: '', dur: 14, tags: 'waterfall, rainforest', t: 0 }, o); }
const spedFor = (t, a, b) => (t >= a - 0.15 && t <= b + 0.15) ? Math.min(clamp((t - a + 0.15) / 0.2), clamp((b + 0.15 - t) / 0.2)) : 0;

// 1. Trips screen
scene('s01', 5.0, [{ at: 0, step: 1, title: 'Trips screen', body: 'A new line at the top shows when this install stops opening.' }], t => {
  const st = base('8:05');
  st.hl = [{ sel: '#tr-install', a: pulse(t, 1.0, 4.4) }];
  st.fade = clamp(t / 0.5);
  return st;
});
// 2. New trip with a type
scene('s02', 11.6, [
  { at: 0, step: 2, title: 'New trip: pick a type', body: 'Pick what kind of trip it is. The type tunes the shot list and the tips for each shot.' },
  { at: 4.6, body: 'No single or multi-day choice here. You add days as you go.' },
  { at: 7.8, body: 'File names now end with the name you give each clip.' }
], t => {
  const st = base('8:06');
  st.trips.spring = t >= 10.9 ? 'new' : null;
  st.newtrip = { p: present(t, 0.45, 10.75), place: t >= 1.95 ? 'Springbrook' : '', type: t >= 3.45 ? 'falls' : 'general', scroll: mix(0, 'max', prog(t, 6.9, 0.9, easeInOut)) };
  st.taps = [{ sel: '#tr-plus', at: 0.25 }, { sel: '#nt-suggest', at: 1.8, dx: -90 }, { sel: '#nt-type-falls', at: 3.3, dx: -40 }, { sel: '#nt-create', at: 10.5 }];
  st.hl = [{ sel: '#nt-typefoot', a: pulse(t, 4.8, 6.7) }, { sel: '#nt-filefoot', a: pulse(t, 8.0, 10.2) }];
  return st;
});
// 3. The shot list follows the type
scene('s03', 9.4, [{ at: 0, step: 3, title: 'The shot list follows the type', body: 'For waterfalls: more DETAIL and SLOMO takes, and 2 AMBIENT takes for the sound of the falls.' }], t => {
  const st = base('8:07'); st.trips.spring = 'new';
  st.trip = T({ x: prog(t, 0.0, 0.5, springy), scroll: mix(0, ATSPOT, prog(t, 2.6, 1.2, easeInOut)) });
  st.hl = [{ sel: '#t-typeRow', a: pulse(t, 0.8, 2.3) }, { sel: '#t-row-AMBIENT', a: pulse(t, 4.0, 7.6) }, { sel: '#t-row-DETAIL', a: pulse(t, 4.0, 7.6) }, { sel: '#t-row-SLOMO', a: pulse(t, 4.0, 7.6) }];
  st.taps = [{ sel: '#t-row-WIDE', at: 8.7 }];
  return st;
});
// 4. Name the first clip
scene('s04', 12.6, [
  { at: 0, step: 4, title: 'Name your first clip', body: "Film the shot as usual. It's sped up here." },
  { at: 4.3, body: 'After the take, give the clip a name. It goes on the end of the file name.' }
], t => {
  const st = base('10:12'); st.trips.spring = 'new'; st.clock = t;
  st.trip = T({ scroll: ATSPOT, clips: t >= 3.75 ? [CL1] : [] });
  const after = t >= 10.6;
  const phase = t < 1.25 ? 'ready' : t < 3.75 ? 'rec' : t < 4.1 ? 'saving' : 'ready';
  st.camera = cam({ p: present(t, 0.0, 11.4), phase, elapsed: clamp((t - 1.25) / 2.5) * 14, t, take: after ? 2 : 1, lens: after ? '1x' : '0.5x', before: after ? 'Same again at 1x.' : 'Show the whole place and its scale.' });
  const name = typed('Lower Falls', t, 6.0, 11);
  st.review = rev({ p: present(t, 4.1, 10.4), title: 'WIDE · take 1', name, focused: t >= 5.75, t, hint: 'Names you use show up here, one tap to reuse.', details: 'Day · 0.5x · 30 fps · 14.0 s' });
  st.taps = [{ sel: '#cam-rec', at: 1.1 }, { sel: '#rv-field', at: 5.7 }, { sel: '#rv-done', at: 10.2 }, { sel: '#cam-close', at: 11.2 }];
  st.hl = [{ sel: '#rv-file', a: pulse(t, 7.4, 9.6) }];
  st.sped = spedFor(t, 1.25, 3.75);
  return st;
});
// 5. The next clip already has the name
scene('s05', 8.8, [{ at: 0, step: 5, title: 'The next clip is already named', body: 'Still at Lower Falls, so the name is filled in. Just tap Done.' }], t => {
  const st = base('10:15'); st.trips.spring = 'new'; st.clock = t;
  st.trip = T({ scroll: ATSPOT, clips: t >= 2.85 ? [CL1, CL2] : [CL1] });
  const after = t >= 6.9;
  const phase = t < 1.65 ? 'ready' : t < 2.85 ? 'rec' : t < 3.15 ? 'saving' : 'ready';
  st.camera = cam({ p: present(t, 0.45, 7.45), kind: 'detail', shot: 'DETAIL', take: after ? 2 : 1, lens: '1x', phase, elapsed: clamp((t - 1.65) / 1.2) * 8, t, stop: 8, before: 'Get close and tap the detail to focus first.' });
  st.review = rev({ p: present(t, 3.15, 6.5), title: 'DETAIL · take 1', kind: 'detail', name: 'Lower Falls', note: true, chips: [{ t: 'Lower Falls', sel: true }], shot: 'DETAIL', details: 'Day · 1x · 30 fps · 8.0 s', dur: 8, tags: 'rainforest, rocks', t });
  st.taps = [{ sel: '#t-row-DETAIL', at: 0.3 }, { sel: '#cam-rec', at: 1.5 }, { sel: '#rv-done', at: 6.35 }, { sel: '#cam-close', at: 7.3 }];
  st.hl = [{ sel: '#rv-namebox', a: pulse(t, 3.9, 6.0) }];
  st.sped = spedFor(t, 1.65, 2.85);
  return st;
});
// 6. At the next waterfall
scene('s06', 11.2, [{ at: 0, step: 6, title: 'At the next waterfall', body: "You've walked on, so the name box starts empty, with Lower Falls one tap away." }], t => {
  const st = base('10:41'); st.trips.spring = 'new'; st.clock = t;
  st.trip = T({ scroll: ATSPOT, clips: t >= 3.4 ? [CL1, CL2, CL3] : [CL1, CL2] });
  const phase = t < 1.75 ? 'ready' : t < 3.4 ? 'rec' : t < 3.7 ? 'saving' : 'ready';
  const after = t >= 9.0;
  st.camera = cam({ p: present(t, 0.55, 10.05), kind: 'twin', take: after ? 3 : 2, lens: '1x', phase, elapsed: clamp((t - 1.75) / 1.65) * 14, t, before: after ? '' : 'Same again at 1x.', msg: after ? 'All 2 takes done. Film an extra, or tap ✕ to pick the next shot.' : '' });
  const name = typed('Twin Falls', t, 6.6, 11);
  st.review = rev({ p: present(t, 3.7, 8.75), title: 'WIDE · take 2', kind: 'twin', name, focused: t >= 6.35, take: 2, chips: [{ t: 'Lower Falls', sel: false }], chipsLabel: 'Recent', details: 'Day · 1x · 30 fps · 14.0 s', t });
  st.taps = [{ sel: '#t-row-WIDE', at: 0.4 }, { sel: '#cam-rec', at: 1.6 }, { sel: '#rv-field', at: 6.3 }, { sel: '#rv-done', at: 8.6 }, { sel: '#cam-close', at: 9.9 }];
  st.hl = [{ sel: '#rv-chip-0', a: pulse(t, 4.6, 6.1) }];
  st.sped = spedFor(t, 1.75, 3.4);
  return st;
});
// 7. Names in the clip list, and renaming
scene('s07', 9.4, [{ at: 0, step: 7, title: 'Names in the clip list', body: 'Each clip shows its name. Tap one to rename it, and its file is renamed too.' }], t => {
  const st = base('10:43'); st.trips.spring = 'new';
  st.trip = T({ scroll: mix(ATSPOT, 'max', prog(t, 0.2, 1.4, easeInOut)), clips: t >= 8.3 ? [CL1, CL2r, CL3] : [CL1, CL2, CL3] });
  const name = 'Lower Falls' + typed(' ferns', t, 5.9, 11);
  st.review = rev({ p: present(t, 4.35, 8.25), title: 'Clip', kind: 'detail', name, focused: t >= 5.6 && t < 8.25, chips: [{ t: 'Twin Falls', sel: false }, { t: 'Lower Falls', sel: name === 'Lower Falls' }], shot: 'DETAIL', details: 'Day · 1x · 30 fps · 8.0 s', dur: 8, tags: 'rainforest, rocks', t });
  st.taps = [{ sel: '#t-clip-c2', at: 4.2 }, { sel: '#rv-field', at: 5.55, dx: 60 }, { sel: '#rv-done', at: 8.1 }];
  st.hl = [{ sel: '#t-clips', a: pulse(t, 1.8, 3.8) }, { sel: '#rv-file', a: pulse(t, 6.6, 7.9) }];
  return st;
});
// 8. Start day 2
scene('s08', 10.6, [{ at: 0, step: 8, title: 'Next morning: start day 2', body: 'Tap + Day 2 for a fresh shot list. Moved on? Give the day its own place and type.' }], t => {
  const st = base('7:40'); st.trips.spring = 'new';
  const started = t >= 8.15;
  st.trip = T({ scroll: started ? 0 : mix('max', 0, prog(t, 0.1, 1.0, easeInOut)), clips: [CL1, CL2r, CL3], sel: started ? 2 : 1, days: started ? 2 : 1 });
  st.daysheet = { p: present(t, 1.65, 8.15), choice: t >= 3.05 ? 'new' : 'same', place: t >= 4.25 ? 'Surfers Paradise' : '', type: t >= 5.45 ? 'city' : 'falls' };
  st.taps = [{ sel: '#t-chip-add', at: 1.5 }, { sel: '#d-new', at: 2.9, dx: -80 }, { sel: '#d-suggest', at: 4.1, dx: -80 }, { sel: '#d-type-city', at: 5.3, dx: -40 }, { sel: '#d-start', at: 8.0 }];
  st.hl = [{ sel: '#d-type-city', a: pulse(t, 5.9, 7.6) }];
  return st;
});
// 9. A city day
scene('s09', 8.6, [{ at: 0, step: 9, title: 'A city day', body: 'FOOD and FOLLOW count now, and the tips change, like a TIMELAPSE of traffic at blue hour.' }], t => {
  const st = base('7:41'); st.trips.spring = 'new';
  const sc = t < 4.0 ? mix(0, ARRIVING, prog(t, 1.4, 1.0, easeInOut)) : mix(ARRIVING, ATSPOT_LOW, prog(t, 4.0, 1.0, easeInOut));
  st.trip = T({ scroll: sc, clips: [CL1, CL2r, CL3], sel: 2, days: 2 });
  st.hl = [{ sel: '#t-typeRow', a: pulse(t, 0.1, 1.3) }, { sel: '#t-row-FOLLOW', a: pulse(t, 2.5, 3.8) }, { sel: '#t-row-FOOD', a: pulse(t, 5.1, 7.9) }, { sel: '#t-row-TIMELAPSE', a: pulse(t, 5.1, 7.9) }];
  return st;
});
// 10. Day 1 is one tap away
scene('s10', 5.2, [{ at: 0, step: 10, title: 'Day 1 is one tap away', body: 'Each day keeps its own shot list, counts and clips.' }], t => {
  const st = base('7:42'); st.trips.spring = 'multi';
  st.trip = T({ x: 1 - prog(t, 4.35, 0.5, springy), scroll: mix(ATSPOT_LOW, 0, prog(t, 0.1, 0.8, easeInOut)), clips: [CL1, CL2r, CL3], sel: t >= 1.45 ? 1 : 2, days: 2 });
  st.taps = [{ sel: '#t-chip-1', at: 1.3 }, { sel: '#t-back', at: 4.2 }];
  st.hl = [{ sel: '#t-hdr', a: pulse(t, 1.7, 3.6) }];
  return st;
});
// 11. Two days before it runs out
scene('s11', 8.2, [{ at: 0, step: 11, title: 'Two days before it runs out', body: 'The line turns orange so you reinstall before your next trip. Your trips and clips stay.' }], t => {
  const st = base(t < 1.6 ? '7:43' : '7:12'); st.trips.spring = 'multi';
  st.trips.warn = t < 1.6 ? 0 : 1;
  st.dip = t < 1.2 ? 0 : t < 1.6 ? (t - 1.2) / 0.4 * 0.85 : 0.85 * (1 - clamp((t - 1.6) / 0.45));
  st.hl = [{ sel: '#tr-install', a: pulse(t, 2.3, 6.8) }];
  return st;
});
// 12. The end card
scene('s12', 6.0, [{ at: 0, step: '1.7 PLAN', title: "That's the plan for 1.7", body: 'Tell me what to change, by step number or the time in the video.' }], t => {
  const st = base('7:12'); st.trips.spring = 'multi'; st.trips.warn = 1;
  st.endP = prog(t, 0.2, 0.7, easeOut);
  return st;
});

// ---------- entry points ----------
function renderScene(i, t) {
  const sc = SCENES[i];
  const st = sc.render(t);
  st.local = t; st.sceneIdx = i; if (st.clock === undefined) st.clock = t;
  apply(st);
  applyCaption(i, t);
}
window.SCENES_META = SCENES.map(s => ({ id: s.id, dur: s.dur }));
window.renderScene = renderScene;
document.fonts.ready.then(() => { build(); renderScene(0, 2); window.ready = true; });
</script>
</body>
